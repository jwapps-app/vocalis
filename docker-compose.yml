# Deployment compose: pulls prebuilt images, so this file plus .env is the
# whole install. Nothing is built and no source tree is needed, which is what
# lets it be pasted straight into Portainer's stack editor.
#
# To build from source instead — developing on this repo — add the override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  db:
    # Postgres with the schema baked in — see db/Dockerfile. The schema arrives
    # in the image rather than as a mounted init.sql so that no source tree has
    # to sit beside this file.
    image: ghcr.io/jwapps-app/vocalis-db:${VOCALIS_TAG:-latest}
    environment:
      POSTGRES_DB: vocalis
      POSTGRES_USER: vocalis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
    ports:
      # The native TTS worker connects here. Loopback by default so the
      # database is not on the network at all; set DB_BIND to this machine's
      # LAN address when the worker runs elsewhere — at which point the
      # password is the only thing protecting it, so make it a real one.
      - "${DB_BIND:-127.0.0.1}:5445:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocalis -d vocalis"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/jwapps-app/vocalis-api:${VOCALIS_TAG:-latest}
    environment:
      # The password is passed separately, never interpolated into the URL.
      # A generated password routinely contains '/' or '+' — openssl rand
      # -base64 emits both — and '/' terminates the authority section of a URI,
      # so the URL silently reparses with the *username* as the hostname. libpq
      # reads PGPASSWORD on its own, so nothing has to be escaped.
      DATABASE_URL: postgresql://vocalis@db:5432/vocalis
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
      DATA_DIR: /data
      # Where the GPU machine reaches Postgres. Baked into the worker bundle
      # the Setup page hands out, so it must be an address that machine can
      # resolve — this host's LAN address when the worker is not on this box.
      WORKER_DB_HOSTPORT: ${WORKER_DB_HOSTPORT:-127.0.0.1:5445}
      # Lets the worker bundle name the address the narrator should fetch
      # books from — the container cannot see how it is published.
      WEB_PORT: ${WEB_PORT:-8091}
    volumes:
      # Uploaded books, narrator voices and finished audiobooks. The narrator
      # no longer needs this — it fetches and posts over HTTP — so nothing has
      # to mount it a second time.
      - ${VOCALIS_DATA_DIR:-./data}:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/jwapps-app/vocalis-web:${VOCALIS_TAG:-latest}
    ports:
      - "${WEB_PORT:-8091}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
