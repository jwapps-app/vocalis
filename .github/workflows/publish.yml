name: Publish images

# Builds the two container images and pushes them to GHCR so a deployment needs
# nothing but docker-compose.yml and .env — no source tree, no build step. That
# matters for NAS deployments in particular: Portainer's stack editor uploads
# only the compose file, so any `build:` directive fails looking for a context
# that was never copied across.

on:
  push:
    branches: [main]
    # Docs-only commits do not change the images.
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: api/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: db
            context: ./db
            dockerfile: ./db/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # A NAS is typically amd64 while a development Mac is arm64, and the
          # same compose file has to work on both.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
