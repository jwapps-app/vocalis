server {
    listen 80;

    # Sized for finished audiobooks, not for EPUBs. The worker posts the M4B
    # back through this proxy, and a long book is far bigger than any book
    # file: 272 MB for one that failed against the previous 200 MB limit, and
    # an eleven-hour recording ran to 331 MB. Rejected uploads are expensive
    # here — the narration is already done, so the cost of the limit being too
    # low is hours of work stuck on the worker's disk.
    #
    # Not a memory cost: proxy_request_buffering is off for /api/, so the body
    # is streamed to the API rather than spooled here first.
    client_max_body_size 8g;

    # Don't advertise the exact nginx build.
    server_tokens off;

    # Compress the text. This matters most for the reader: a nine-hour book
    # carries every word it speaks and when, which is tens of thousands of
    # short JSON objects with the same three keys — close to the ideal case
    # for gzip, and megabytes of it over a phone connection otherwise.
    #
    # gzip_proxied any is the part that reaches API responses; without it only
    # files nginx serves itself are compressed, which is the half that was
    # already small. Audio is not listed and so is never compressed: it is
    # compressed already, and gzipping it would break the Range requests the
    # player seeks with.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # security-headers.conf is included in *every* location, not set once here:
    # nginx's add_header does not merge, so a location that sets any header of
    # its own (several below set Cache-Control) silently discards everything
    # inherited from the server block.
    include /etc/nginx/security-headers.conf;

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8000;

        # Without these the API sees Host: api:8000 — nginx's own upstream name
        # — and any address it derives for the worker points at a private
        # Compose hostname no other machine can resolve. $host is what the
        # browser actually used, port included, which is the only value that is
        # correct by construction.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # index.html names the current hashed bundle, so a stale copy pins the tab
    # to an old build — revalidate it every load. The hashed assets it points
    # at never change under a given name, so they cache forever.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # The service worker decides what every other request may use from cache,
    # so a stale copy of *it* would pin an installed app to an old build
    # permanently — the one file where caching is genuinely unsafe.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { } default_type "application/javascript; charset=utf-8";
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        # nginx's default mime.types has no mapping for .webmanifest, and some
        # browsers reject the manifest if it arrives as octet-stream.
        types { } default_type "application/manifest+json; charset=utf-8";
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
