# Included into every location rather than set once on the server block.
# nginx's add_header does not merge: a location that sets any header of its own
# discards every add_header inherited from its parent. Several locations here
# set Cache-Control, so relying on inheritance would silently drop these from
# exactly the responses that matter most.

# The app loads nothing from anywhere else — no CDN, no fonts, no analytics —
# so the policy can be strict enough to be worth having. 'unsafe-inline' covers
# the bundler's stylesheet; data:/blob: cover art and audio previews.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# A response whose bytes came from an uploaded EPUB must never be sniffed into
# something executable.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
