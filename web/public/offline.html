<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Vocalis — offline</title>
    <!-- Self-contained on purpose: this page is shown precisely when nothing
         else can be fetched. -->
    <style>
      :root { color-scheme: light dark; --bg:#f6f7fb; --surface:#fff; --text:#16182b;
              --muted:#6b7089; --border:#e3e5ef; --brand:#4f46e5; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0f1018; --surface:#191b28; --text:#eceef5; --muted:#969bb3;
                --border:#2a2d3f; }
      }
      body { margin:0; min-height:100vh; display:grid; place-items:center;
             background:var(--bg); color:var(--text); padding:1.5rem;
             font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
             font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
      .card { background:var(--surface); border:1px solid var(--border);
              border-radius:16px; padding:2rem; max-width:26rem; text-align:center;
              box-shadow:0 1px 2px rgba(22,24,43,.05),0 8px 24px -12px rgba(22,24,43,.18); }
      h1 { font-size:1.25rem; margin:1rem 0 .5rem; letter-spacing:-.02em; }
      p { color:var(--muted); margin:0 0 .75rem; }
      button { font:inherit; font-weight:600; margin-top:.75rem; padding:.6rem 1.3rem;
               border:0; border-radius:10px; background:var(--brand); color:#fff;
               cursor:pointer; }
    </style>
  </head>
  <body>
    <main class="card">
      <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#4f46e5" />
        <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".9">
          <path d="M23.3 25.0 A10 10 0 0 1 40.7 25.0" stroke-width="4" />
          <path d="M17.6 21.5 A16.5 16.5 0 0 1 46.4 21.5" stroke-width="3.6" opacity=".6" />
        </g>
        <g fill="#fff">
          <path d="M32 35.5 C27 31.5 20 30.2 13.5 31.2 A1.5 1.5 0 0 0 12.2 32.7 L12.2 47.6 A1.5 1.5 0 0 0 14 49.1 C19.6 48.2 26.6 49.3 31 52.6 A1.6 1.6 0 0 0 32 52.9 Z" />
          <path d="M32 35.5 C37 31.5 44 30.2 50.5 31.2 A1.5 1.5 0 0 1 51.8 32.7 L51.8 47.6 A1.5 1.5 0 0 1 50 49.1 C44.4 48.2 37.4 49.3 33 52.6 A1.6 1.6 0 0 1 32 52.9 Z" opacity=".82" />
        </g>
      </svg>
      <h1>Can't reach Vocalis</h1>
      <p>
        The library and the narrator both live on your server, so Vocalis needs a
        connection to it. Any book already converting keeps going without you.
      </p>
      <p>Check that the machine running Vocalis is awake and on the same network.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
